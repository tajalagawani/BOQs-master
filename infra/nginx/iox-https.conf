# IOX nginx config with HTTPS — apply on the VM once a domain points at it.
#
# Apply procedure:
#   1. Point a DNS A record at 20.203.125.83 (e.g. iox.example.com)
#   2. SSH to the VM
#   3. sudo cp /home/iox/app/infra/nginx/iox-https.conf /etc/nginx/sites-available/iox
#   4. Replace `iox.example.com` with your real domain in that file
#   5. sudo certbot --nginx -d iox.example.com
#      (certbot edits the file to inject the cert paths + the 80→443 redirect)
#   6. sudo nginx -t && sudo systemctl reload nginx
#
# Until applied, nginx continues to serve from /etc/nginx/sites-available/iox
# (the HTTP-only config the bootstrap wrote).

server {
  listen 80;
  listen [::]:80;
  server_name iox.example.com;            # ← edit to your domain

  # ACME challenge for certbot renewals
  location /.well-known/acme-challenge/ { root /var/www/html; }

  # Everything else redirects to HTTPS once certbot has run
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name iox.example.com;            # ← edit to your domain

  # certbot fills these two in:
  # ssl_certificate     /etc/letsencrypt/live/iox.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/iox.example.com/privkey.pem;
  # include             /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers (additive, no app changes required)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options    nosniff                              always;
  add_header X-Frame-Options           SAMEORIGIN                           always;
  add_header Referrer-Policy           strict-origin-when-cross-origin      always;

  # Tender uploads can be large; AI extractions can run a while
  client_max_body_size 1024M;
  proxy_read_timeout   900s;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        'upgrade';
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
